# SPDX-License-Identifier: LGPL-3.0-only
name: CI

# Runs on pull requests, pushes to main, and manual dispatch. Feature branches
# are validated by the pull-request workflow to avoid duplicate test matrices for
# the mirrored working and review branches. No deployment or production resource
# is touched; tests use only repository fixtures and synthetic data.

on:
  pull_request:
  push:
    # Run again on the protected target after a PR merge. Feature branches are
    # covered by pull_request and can be tested manually with workflow_dispatch.
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, coverage and static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # rapidocr-onnxruntime 1.4.4 declares requires-python <3.13.
        # Restore requires security-patched tarfile extraction: Python 3.11.17+
        # Python 3.12.15 is source-only, so the Windows job uses the last binary 3.12.10
        # release; restore independently rejects TAR links and unsafe path forms before extraction.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Report the resolved toolchain
        run: |
          python --version
          python -m pip --version

      # The declared runtime dependency set is the headless OpenCV build (see
      # the OpenCV note in requirements.lock.txt), which needs no system
      # graphics libraries.  The optional GUI build would additionally require
      # libgl1 and libglib2.0-0; they are deliberately NOT installed here so
      # that CI proves the minimal, system-library-free configuration works.
      - name: Install the declared dependency set (hash-verified)
        run: |
          python -m pip install --upgrade pip
          # --require-hashes rejects any artifact whose digest is not in the
          # lockfile, so a compromised index or mirror cannot substitute a wheel
          # under a pinned version. Every authentic file for each pinned version
          # is listed (all platforms), which is why this works on Windows too.
          python -m pip install --no-deps --require-hashes -r requirements.lock.hashes.txt
          python tools/generate_hash_lock.py --check

      - name: Validate the dependency graph explicitly
        run: python tools/verify_dependency_graph.py

      # Fails loudly rather than silently skipping OCR if OpenCV or RapidOCR
      # cannot be imported.  Also asserts the headless build is authoritative.
      - name: Assert cv2 and RapidOCR import
        run: |
          python - <<'PY'
          import cv2
          from rapidocr_onnxruntime import RapidOCR

          print("cv2", cv2.__version__)
          assert cv2.__version__.startswith("4.11."), cv2.__version__
          assert RapidOCR is not None
          print("RapidOCR import OK")
          PY

      - name: Static check (ruff)
        run: python -m ruff check dz_erp tests tools

      - name: Byte-compile all sources
        run: python -m compileall -q dz_erp tests tools

      # The exit status is preserved so the step fails, but the JUnit report is
      # first converted into per-test annotations and a Markdown summary: a red
      # build that does not name the broken tests is not actionable output.
      - name: Run the complete test suite with coverage
        run: |
          set +e
          python -m pytest \
            --cov=dz_erp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -ra
          status=$?
          set -e
          echo "pytest exit status: $status"
          tail -n 30 junit.xml >/dev/null 2>&1 || true
          python tools/ci_report_failures.py junit.xml || true
          exit $status

      # A passing unit suite does not prove the packaged application can execute
      # the documented invoice-to-ledger/recovery flow. This isolated acceptance
      # run uses temporary state and synthetic records only; it has no credentials
      # or production endpoint. Run once, not twice, for the Python matrix.
      - name: Run isolated synthetic staging acceptance
        if: matrix.python-version == '3.11'
        run: |
          set -o pipefail
          python tools/staging_acceptance.py 2>&1 | tee staging-acceptance.log

      - name: Validate risk-register summary
        if: matrix.python-version == '3.11'
        run: python tools/risk_register_counts.py

      - name: Summarise the results
        if: always()
        run: |
          {
            echo "### CI summary"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- Test result: \`${{ job.status }}\`"
            if [ -f junit.xml ]; then
              echo "- JUnit report: junit.xml (tests, failures, errors, skips)"
            fi
            if [ -f coverage.xml ]; then
              echo "- Coverage report: coverage.xml / htmlcov/index.html"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            junit.xml
            coverage.xml
            htmlcov/**
            staging-acceptance.log

  # ---------------------------------------------------------------------------
  # Windows verification
  # ---------------------------------------------------------------------------
  # The Linux job above cannot prove anything about Windows: file permissions
  # are ACLs rather than mode bits, `os.fchmod` does not exist, `os.replace`
  # fails while a reader holds the destination, and O_APPEND is not atomic.
  # A defect of that class was found in this repository's key-rotation code
  # precisely by asking this question, so the platform is tested rather than
  # assumed.
  #
  # Scope is deliberately the platform-sensitive surface - key rotation,
  # migration, backup/restore, permissions, durable logging, process-boundary
  # recovery - not the whole suite, which the Linux matrix already covers at
  # two Python versions.
  verify-windows:
    name: Key rotation, backup and recovery on Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10 (last Windows installer; strict tar preflight)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Report the resolved toolchain
        run: |
          python --version
          python -m pip --version

      - name: Install the declared dependency set (hash-verified)
        run: |
          python -m pip install --upgrade pip
          # --require-hashes rejects any artifact whose digest is not in the
          # lockfile, so a compromised index or mirror cannot substitute a wheel
          # under a pinned version. Every authentic file for each pinned version
          # is listed (all platforms), which is why this works on Windows too.
          python -m pip install --no-deps --require-hashes -r requirements.lock.hashes.txt
          python tools/generate_hash_lock.py --check

      - name: Validate the dependency graph explicitly
        run: python tools/verify_dependency_graph.py

      - name: Static check (ruff)
        run: python -m ruff check dz_erp tests tools

      - name: Byte-compile all sources
        run: python -m compileall -q dz_erp tests tools

      - name: Key rotation, migration, backup/restore, logging and recovery tests
        run: |
          python -m pytest `
            tests/test_phase5_security_audit_backup.py `
            tests/test_phase9_durable_security_log.py `
            tests/test_phase9_process_boundary.py `
            tests/test_phase10_vault_key_rotation.py `
            tests/test_phase11_audit_key_rotation.py `
            tests/test_phase12_key_migration_and_backup.py `
            tests/test_phase13_key_rotation_regression.py `
            tests/test_phase17_key_providers.py `
            tests/test_phase18_ocr_confidence_provenance.py `
            tests/test_phase23_staging_acceptance.py `
            --junitxml=junit-windows.xml -ra

      # The checkpoint acceptance path is a local sibling-directory simulation,
      # not a real remote host. Running it here validates Windows-specific file,
      # process and rotation behaviour without overstating remote durability.
      - name: Run isolated synthetic staging acceptance on Windows
        shell: pwsh
        run: |
          & python tools/staging_acceptance.py 2>&1 | Tee-Object -FilePath staging-acceptance-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows test and staging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          retention-days: 14
          if-no-files-found: warn
          path: |
            junit-windows.xml
            staging-acceptance-windows.log

  # ---------------------------------------------------------------------------
  # Desktop (Qt) verification
  # ---------------------------------------------------------------------------
  # No job above can execute a single line of the desktop UI: PySide6 is an
  # optional extra (deliberately absent from requirements.lock.txt so the server
  # and the main matrix stay headless), so `importorskip("PySide6.QtWidgets")`
  # skipped every one of those tests in CI while they passed locally. That is a
  # one-sided test record: the review dialog, the RBAC-driven user screen and the
  # RTL/Arabic layout were only ever verified on a developer machine.
  #
  # This job installs the desktop lockfile and runs the GUI suites for real. It
  # uses Qt's `offscreen` platform plugin rather than Xvfb: the suites construct
  # windows, render them and measure geometry, none of which needs a display
  # server, and offscreen keeps the job deterministic and headless. Real display
  # behaviour (High-DPI scaling, Arabic shaping on a physical screen) remains a
  # Windows/manual acceptance item - see the phase 59A report.
  verify-desktop:
    name: Desktop UI (PySide6, Qt offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-desktop.lock.txt

      - name: Install the runtime dependency set (hash-verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps --require-hashes -r requirements.lock.hashes.txt
          python tools/generate_hash_lock.py --check

      # Qt links libGL/libEGL/libxkbcommon even when it renders offscreen. The
      # runtime lockfile uses the headless OpenCV build precisely to avoid these
      # libraries on the server, so the desktop job installs them explicitly and
      # separately - the server job is unchanged and still proves the minimal
      # configuration works without them.
      - name: Install the GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install the desktop dependency set (hash-verified)
        run: |
          python -m pip install --no-deps --require-hashes -r requirements-desktop.lock.hashes.txt
          python tools/generate_hash_lock.py --desktop --check

      - name: Assert PySide6 imports with the locked version
        run: |
          python - <<'PY'
          import PySide6
          from PySide6.QtWidgets import QApplication

          print("PySide6", PySide6.__version__, PySide6.__file__)
          assert PySide6.__version__ == "6.11.2", PySide6.__version__
          print("QtWidgets import OK")
          PY

      # The GUI suites must *run*, not skip. A skip here means the exact
      # condition this job exists to detect has reappeared, so it is a failure.
      - name: Run the desktop UI suites (no skips permitted)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest \
            tests/test_phase26_desktop.py \
            tests/test_phase27_desktop_ui.py \
            tests/test_phase27_review_api.py \
            tests/test_phase28_desktop_users_ui.py \
            tests/test_phase29_desktop_redesign.py \
            --junitxml=junit-desktop.xml -ra
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("junit-desktop.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          print(f"desktop suites: {tests} tests, {skipped} skipped, {failures} failed, {errors} errors")
          if skipped:
              print("FAILED: the desktop job must not skip Qt tests - PySide6 is installed")
              sys.exit(1)
          if tests == 0:
              print("FAILED: the desktop suites collected no tests")
              sys.exit(1)
          PY

      - name: Upload the desktop test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-desktop
          retention-days: 14
          if-no-files-found: warn
          path: junit-desktop.xml
