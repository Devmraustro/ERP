# SPDX-License-Identifier: LGPL-3.0-only
name: CI

# Runs on pull requests and on pushes to the working branch.  It performs no
# deployment, touches no production resource, and needs no credentials, no
# customer data and no external financial service: every input is either the
# repository itself or a synthetic fixture generated by the test suite.

on:
  pull_request:
  push:
    branches:
      # The earlier working branch is kept so its history remains covered; the
      # key-rotation work continues on the current one.
      - arena/5c240e1d-erp
      - arena/6c474c64-erp
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, coverage and static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # rapidocr-onnxruntime 1.4.4 declares requires-python <3.13, and
        # pyproject.toml requires >=3.11, so the supported range is 3.11-3.12.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Report the resolved toolchain
        run: |
          python --version
          python -m pip --version

      # The declared runtime dependency set is the headless OpenCV build (see
      # the OpenCV note in requirements.lock.txt), which needs no system
      # graphics libraries.  The optional GUI build would additionally require
      # libgl1 and libglib2.0-0; they are deliberately NOT installed here so
      # that CI proves the minimal, system-library-free configuration works.
      - name: Install the declared dependency set
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.lock.txt

      - name: Validate the dependency graph explicitly
        run: python tools/verify_dependency_graph.py

      # Fails loudly rather than silently skipping OCR if OpenCV or RapidOCR
      # cannot be imported.  Also asserts the headless build is authoritative.
      - name: Assert cv2 and RapidOCR import
        run: |
          python - <<'PY'
          import cv2
          from rapidocr_onnxruntime import RapidOCR

          print("cv2", cv2.__version__)
          assert cv2.__version__.startswith("4.11."), cv2.__version__
          assert RapidOCR is not None
          print("RapidOCR import OK")
          PY

      - name: Static check (ruff)
        run: python -m ruff check dz_erp tests tools

      - name: Byte-compile all sources
        run: python -m compileall -q dz_erp tests tools

      # The exit status is preserved so the step fails, but the JUnit report is
      # first converted into per-test annotations and a Markdown summary: a red
      # build that does not name the broken tests is not actionable output.
      - name: Run the complete test suite with coverage
        run: |
          set +e
          python -m pytest \
            --cov=dz_erp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -ra
          status=$?
          set -e
          echo "pytest exit status: $status"
          tail -n 30 junit.xml >/dev/null 2>&1 || true
          python tools/ci_report_failures.py junit.xml || true
          exit $status

      - name: Summarise the results
        if: always()
        run: |
          {
            echo "### CI summary"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- Test result: \`${{ job.status }}\`"
            if [ -f junit.xml ]; then
              echo "- JUnit report: junit.xml (tests, failures, errors, skips)"
            fi
            if [ -f coverage.xml ]; then
              echo "- Coverage report: coverage.xml / htmlcov/index.html"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            junit.xml
            coverage.xml
            htmlcov/**
