# SPDX-License-Identifier: LGPL-3.0-only
name: CI

# Runs on pull requests, pushes to main, and manual dispatch. Feature branches
# are validated by the pull-request workflow to avoid duplicate test matrices for
# the mirrored working and review branches. No deployment or production resource
# is touched; tests use only repository fixtures and synthetic data.

on:
  pull_request:
  push:
    # Run again on the protected target after a PR merge. Feature branches are
    # covered by pull_request and can be tested manually with workflow_dispatch.
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, coverage and static checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # rapidocr-onnxruntime 1.4.4 declares requires-python <3.13.
        # Restore requires security-patched tarfile extraction: Python 3.11.17+
        # Python 3.12.15 is source-only, so the Windows job uses the last binary 3.12.10
        # release; restore independently rejects TAR links and unsafe path forms before extraction.
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Report the resolved toolchain
        run: |
          python --version
          python -m pip --version

      # The declared runtime dependency set is the headless OpenCV build (see
      # the OpenCV note in requirements.lock.txt), which needs no system
      # graphics libraries.  The optional GUI build would additionally require
      # libgl1 and libglib2.0-0; they are deliberately NOT installed here so
      # that CI proves the minimal, system-library-free configuration works.
      - name: Install the declared dependency set (hash-verified)
        run: |
          python -m pip install --upgrade pip
          # --require-hashes rejects any artifact whose digest is not in the
          # lockfile, so a compromised index or mirror cannot substitute a wheel
          # under a pinned version. Every authentic file for each pinned version
          # is listed (all platforms), which is why this works on Windows too.
          python -m pip install --no-deps --require-hashes -r requirements.lock.hashes.txt
          python tools/generate_hash_lock.py --check

      - name: Validate the dependency graph explicitly
        run: python tools/verify_dependency_graph.py

      # Fails loudly rather than silently skipping OCR if OpenCV or RapidOCR
      # cannot be imported.  Also asserts the headless build is authoritative.
      - name: Assert cv2 and RapidOCR import
        run: |
          python - <<'PY'
          import cv2
          from rapidocr_onnxruntime import RapidOCR

          print("cv2", cv2.__version__)
          assert cv2.__version__.startswith("4.11."), cv2.__version__
          assert RapidOCR is not None
          print("RapidOCR import OK")
          PY

      - name: Static check (ruff)
        run: python -m ruff check dz_erp tests tools

      - name: Byte-compile all sources
        run: python -m compileall -q dz_erp tests tools

      # The exit status is preserved so the step fails, but the JUnit report is
      # first converted into per-test annotations and a Markdown summary: a red
      # build that does not name the broken tests is not actionable output.
      - name: Run the complete test suite with coverage
        run: |
          set +e
          python -m pytest \
            --cov=dz_erp \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml \
            -ra
          status=$?
          set -e
          echo "pytest exit status: $status"
          tail -n 30 junit.xml >/dev/null 2>&1 || true
          python tools/ci_report_failures.py junit.xml || true
          exit $status

      # A passing unit suite does not prove the packaged application can execute
      # the documented invoice-to-ledger/recovery flow. This isolated acceptance
      # run uses temporary state and synthetic records only; it has no credentials
      # or production endpoint. Run once, not twice, for the Python matrix.
      - name: Run isolated synthetic staging acceptance
        if: matrix.python-version == '3.11'
        run: |
          set -o pipefail
          python tools/staging_acceptance.py 2>&1 | tee staging-acceptance.log

      - name: Validate risk-register summary
        if: matrix.python-version == '3.11'
        run: python tools/risk_register_counts.py

      - name: Summarise the results
        if: always()
        run: |
          {
            echo "### CI summary"
            echo "- Python: \`$(python --version 2>&1)\`"
            echo "- Test result: \`${{ job.status }}\`"
            if [ -f junit.xml ]; then
              echo "- JUnit report: junit.xml (tests, failures, errors, skips)"
            fi
            if [ -f coverage.xml ]; then
              echo "- Coverage report: coverage.xml / htmlcov/index.html"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            junit.xml
            coverage.xml
            htmlcov/**
            staging-acceptance.log

  # ---------------------------------------------------------------------------
  # Windows verification
  # ---------------------------------------------------------------------------
  # The Linux job above cannot prove anything about Windows: file permissions
  # are ACLs rather than mode bits, `os.fchmod` does not exist, `os.replace`
  # fails while a reader holds the destination, and O_APPEND is not atomic.
  # A defect of that class was found in this repository's key-rotation code
  # precisely by asking this question, so the platform is tested rather than
  # assumed.
  #
  # Scope is deliberately the platform-sensitive surface - key rotation,
  # migration, backup/restore, permissions, durable logging, process-boundary
  # recovery - not the whole suite, which the Linux matrix already covers at
  # two Python versions.
  verify-windows:
    name: Key rotation, backup and recovery on Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10 (last Windows installer; strict tar preflight)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Report the resolved toolchain
        run: |
          python --version
          python -m pip --version

      - name: Install the declared dependency set (hash-verified)
        run: |
          python -m pip install --upgrade pip
          # --require-hashes rejects any artifact whose digest is not in the
          # lockfile, so a compromised index or mirror cannot substitute a wheel
          # under a pinned version. Every authentic file for each pinned version
          # is listed (all platforms), which is why this works on Windows too.
          python -m pip install --no-deps --require-hashes -r requirements.lock.hashes.txt
          python tools/generate_hash_lock.py --check

      - name: Validate the dependency graph explicitly
        run: python tools/verify_dependency_graph.py

      - name: Static check (ruff)
        run: python -m ruff check dz_erp tests tools

      - name: Byte-compile all sources
        run: python -m compileall -q dz_erp tests tools

      - name: Key rotation, migration, backup/restore, logging and recovery tests
        run: |
          python -m pytest `
            tests/test_phase5_security_audit_backup.py `
            tests/test_phase9_durable_security_log.py `
            tests/test_phase9_process_boundary.py `
            tests/test_phase10_vault_key_rotation.py `
            tests/test_phase11_audit_key_rotation.py `
            tests/test_phase12_key_migration_and_backup.py `
            tests/test_phase13_key_rotation_regression.py `
            tests/test_phase17_key_providers.py `
            tests/test_phase18_ocr_confidence_provenance.py `
            tests/test_phase23_staging_acceptance.py `
            --junitxml=junit-windows.xml -ra

      # The checkpoint acceptance path is a local sibling-directory simulation,
      # not a real remote host. Running it here validates Windows-specific file,
      # process and rotation behaviour without overstating remote durability.
      - name: Run isolated synthetic staging acceptance on Windows
        shell: pwsh
        run: |
          & python tools/staging_acceptance.py 2>&1 | Tee-Object -FilePath staging-acceptance-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows test and staging reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          retention-days: 14
          if-no-files-found: warn
          path: |
            junit-windows.xml
            staging-acceptance-windows.log

  # ---------------------------------------------------------------------------
  # Dependency vulnerability gate (DEP-1 / risk register P20)
  # ---------------------------------------------------------------------------
  # A clean scan is necessary, not sufficient (see tools/security_scan_gate.py):
  # it proves no KNOWN advisory applies to the committed dependency set, and
  # says nothing about undisclosed vulnerabilities. The scanner version is
  # pinned so the same tool decides the same tree the same way; the report and
  # the decision are kept as artifacts. pip-audit is deliberately NOT a project
  # dependency: it audits the lockfile declaration, it is not installed into
  # the runtime environment (--no-deps --disable-pip), so the audit covers the
  # committed transitive closure and nothing the local environment contains.
  # Transitive dependencies cannot be silently skipped: the hash-pinned
  # lockfile enumerates the full closure.
  dependency-scan:
    name: Dependency vulnerability scan (pip-audit, pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned scanner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1

      - name: Scan the committed dependency set
        run: |
          python tools/security_scan_gate.py scan --report sca-report.json

      - name: Upload the scan report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          retention-days: 90
          if-no-files-found: error
          path: |
            sca-report.json
            sca-report.json.decision.json

      # A scanner that cannot demonstrate detection is decoration. This runs
      # the same gate against an isolated, deliberately vulnerable fixture and
      # requires the gate to reject it (exit 1, unresolved jinja2 advisory):
      # never installed, only audited as a requirement declaration.
      - name: Self-check - the gate must reject a deliberately vulnerable fixture
        run: |
          set +e
          python tools/security_scan_gate.py scan \
            --requirements tools/security_scan_selfcheck/requirements-fixture.txt \
            --report sca-selfcheck-report.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "the gate passed a deliberately vulnerable fixture - it is not detecting anything" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "expected exit 1 (unresolved advisories), got $status" >&2
            exit 1
          fi
          python - <<'PY'
          import json

          decision = json.load(open("sca-selfcheck-report.json.decision.json"))
          assert decision["decision"] == "fail", decision
          packages = {
              d["package"] for d in decision["dispositions"] if d["status"] == "unresolved"
          }
          assert "jinja2" in packages, decision
          print("self-check OK: the gate flagged jinja2 in the isolated fixture")
          PY

  # ---------------------------------------------------------------------------
  # Docker image build, smoke test, SBOM and vulnerability scan (OPS-1)
  # ---------------------------------------------------------------------------
  # Builds the exact committed image, verifies it starts as an unprivileged user,
  # exercises the bootstrap and health endpoints with synthetic data, generates an
  # SPDX SBOM, scans OS + Python packages, and applies the documented security
  # gate: fail on Critical and on fixable High; report (do not fail on) High
  # without an available fix, Medium and Low. Findings are preserved in the
  # uploaded artifacts and are never suppressed to obtain a green build.
  docker:
    name: Docker image build, smoke test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build the image
        run: |
          # --load is required with the docker-container buildx driver: without it
          # the image lands in buildx's own store and `docker run`/`docker scout`
          # on the host daemon cannot see it.
          docker build --load -f ops/Dockerfile -t erp-algeria:ci .

      - name: Verify the runtime user is unprivileged
        run: |
          user=$(docker image inspect erp-algeria:ci --format '{{.Config.User}}')
          echo "Configured user: $user"
          test "$user" = "erp" || { echo "image must run as 'erp', got '$user'" >&2; exit 1; }

      - name: Smoke test - bootstrap creates the first admin (synthetic data only)
        run: |
          # Bootstrap must run BEFORE the server starts: serve refuses to run
          # against an empty database (exit 2) by design.
          printf 'Synthetic#2026x' | docker run --rm -i \
            -v erp-smoke-state:/var/lib/erp -v erp-smoke-logs:/var/log/erp \
            -e ERP_DB_PATH=/var/lib/erp/erp.sqlite3 \
            -e ERP_VAULT_PATH=/var/lib/erp/vault \
            -e ERP_SECURITY_LOG_PATH=/var/log/erp/security.jsonl \
            erp-algeria:ci --bootstrap-admin admin
          echo "bootstrap exit: $?"

      - name: Smoke test - container starts and /healthz answers
        run: |
          docker run -d --name erp-smoke -p 127.0.0.1:8000:8000 \
            -v erp-smoke-state:/var/lib/erp -v erp-smoke-logs:/var/log/erp \
            -e ERP_DB_PATH=/var/lib/erp/erp.sqlite3 \
            -e ERP_VAULT_PATH=/var/lib/erp/vault \
            -e ERP_SECURITY_LOG_PATH=/var/log/erp/security.jsonl \
            -e ERP_HOST=0.0.0.0 -e ERP_PORT=8000 \
            erp-algeria:ci
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "healthz did not become ready within 90s" >&2
            docker ps -a --filter name=erp-smoke
            docker logs erp-smoke 2>&1 | tail -n 40
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/healthz
          docker logs erp-smoke 2>&1 | tail -n 20 > smoke-logs.txt

      - name: Smoke test - X-Forwarded-For is honoured only from a trusted peer
        run: |
          # No trusted proxy is configured on this container, so the forwarded
          # header is caller-supplied data that MUST be ignored: the logged
          # client_ip is the real peer (the docker bridge gateway), never the
          # spoofed value. That is the fail-closed property.
          python - <<'PY'
          import json, subprocess, urllib.request
          req = urllib.request.Request("http://127.0.0.1:8000/healthz",
                                      headers={"X-Forwarded-For": "1.2.3.4"})
          urllib.request.urlopen(req).read()
          out = subprocess.check_output(
              ["docker", "exec", "erp-smoke", "tail", "-n", "1", "/var/log/erp/security.jsonl"],
              text=True,
          ).strip()
          record = json.loads(out)
          client_ip = record["context"]["client_ip"]
          assert client_ip != "1.2.3.4", (
              "a spoofed X-Forwarded-For was accepted without a trusted proxy: " + out
          )
          print("XFF ignored (no trusted proxy); logged client_ip:", client_ip)
          PY

      - name: Record image metadata
        run: |
          docker image inspect erp-algeria:ci --format '{{json .}}' > image-metadata.json
          python - <<'PY'
          import json
          d = json.load(open("image-metadata.json"))
          meta = {
              "id": d["Id"],
              "created": d["Created"],
              "size_bytes": d["Size"],
              "user": d["Config"].get("User"),
              "entrypoint": d["Config"].get("Entrypoint"),
              "env_erp": [e for e in (d["Config"].get("Env") or []) if e.startswith("ERP_")],
              "base_image": "python:3.11.17-slim-bookworm",
              "source_sha": "${{ github.sha }}",
          }
          json.dump(meta, open("image-metadata.json", "w"), indent=2)
          print(json.dumps(meta, indent=2))
          PY

      - name: Generate SBOM (SPDX 2.3 JSON, syft pinned)
        run: |
          # docker scout's plugin is not guaranteed on hosted runners; use the
          # pinned syft release so the SBOM is reproducible.
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.0
          syft erp-algeria:ci -o spdx-json=sbom.spdx.json

      - name: Scan image (trivy JSON, pinned action)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: erp-algeria:ci
          scan-type: image
          format: json
          output: vulns.json
          vuln-type: os,library
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Scan image (trivy SARIF, pinned action)
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4 # v0.32.0
        with:
          image-ref: erp-algeria:ci
          scan-type: image
          format: sarif
          output: vulns.sarif
          vuln-type: os,library
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Apply the documented security gate
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("vulns.json"))

          def has_fix(v):
              return bool((v.get("FixedVersion") or "").strip())

          critical, fixable_high, unfixable_high, medium, low = [], [], [], [], []
          for result in report.get("Results", []):
              target = result.get("Target", "")
              for vuln in result.get("Vulnerabilities") or []:
                  bucket = {
                      "CRITICAL": critical,
                      "HIGH": fixable_high if has_fix(vuln) else unfixable_high,
                      "MEDIUM": medium,
                      "LOW": low,
                  }[vuln.get("Severity", "UNKNOWN")]
                  bucket.append((target, vuln))

          print(f"image scan: critical={len(critical)} high_fixable={len(fixable_high)} "
                f"high_unfixable={len(unfixable_high)} medium={len(medium)} low={len(low)}")
          if critical:
              print("FAIL: Critical vulnerabilities present:")
              for target, v in critical:
                  print("  ", v.get("VulnerabilityID"), target, "->", v.get("FixedVersion"))
              sys.exit(1)
          if fixable_high:
              print("FAIL: High vulnerabilities with an available fix:")
              for target, v in fixable_high:
                  print("  ", v.get("VulnerabilityID"), target, "->", v.get("FixedVersion"))
              sys.exit(1)
          print("Gate: PASS (no Critical, no fixable High). "
                f"{len(unfixable_high)} High without a fix, {len(medium)} Medium, "
                f"{len(low)} Low are reported above and retained in vulns.json/vulns.sarif.")
          PY

      - name: Stop and remove the smoke container
        if: always()
        run: |
          docker stop erp-smoke 2>/dev/null || true
          docker rm erp-smoke 2>/dev/null || true
          docker volume rm erp-smoke-state erp-smoke-logs 2>/dev/null || true

      - name: Upload Docker artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-reports
          retention-days: 90
          if-no-files-found: warn
          path: |
            sbom.spdx.json
            vulns.json
            vulns.sarif
            image-metadata.json
            smoke-logs.txt
