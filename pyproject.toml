[build-system]
requires = ["setuptools>=66.1.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algerian-ai-erp"
version = "0.1.0"
description = "Algerian AI ERP Platform — SCF Localization, AI/OCR Invoice Intake, 3-Way Match Procurement & Tamper-Evident Financial Ledger"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.11.1",
    "sqlalchemy==2.0.40",
    "pypdf==5.4.0",
    "pdfplumber==0.11.6",
    "reportlab==4.3.1",
    "pillow==11.1.0",
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python-headless==4.11.0.86",
    "cryptography==44.0.2",
    "python-multipart==0.0.20",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
