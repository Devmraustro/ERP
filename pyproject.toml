[build-system]
requires = ["setuptools>=66.1.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algerian-ai-erp"
version = "0.1.0"
description = "Algerian AI ERP Platform — SCF Localization, AI/OCR Invoice Intake, 3-Way Match Procurement & Tamper-Evident Financial Ledger"
readme = "README.md"
license = {text = "LGPL-3.0-only"}
requires-python = ">=3.11.17,<3.13,!=3.12.0,!=3.12.1,!=3.12.2,!=3.12.3,!=3.12.4,!=3.12.5,!=3.12.6,!=3.12.7,!=3.12.8,!=3.12.9,!=3.12.10,!=3.12.11,!=3.12.12,!=3.12.13,!=3.12.14"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.11.1",
    "sqlalchemy==2.0.40",
    "pypdf==5.4.0",
    "pdfplumber==0.11.6",
    "reportlab==4.3.1",
    "pillow==11.1.0",
    "rapidocr-onnxruntime==1.4.4",
    # rapidocr-onnxruntime transitively requires the *GUI* `opencv-python`
    # wheel, which bundles the Qt5/xcb stack and links libGL.so.1.  Only the
    # core `cv2` API is used here, so `opencv-python-headless` is the build we
    # actually run.  See the OpenCV note in requirements.lock.txt.
    "opencv-python-headless==4.11.0.86",
    "cryptography==44.0.2",
    "python-multipart==0.0.20",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    # Async test helpers (read_bounded_upload / close_upload are coroutines).
    # 1.3.0 is the newest release compatible with the pinned pytest==8.3.5.
    "pytest-asyncio==1.3.0",
    # Static check used by CI; see [tool.ruff] below.
    "ruff==0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["dz_erp", "tests", "tools"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
# A deliberately small, high-signal ruleset: dead imports and variables (F),
# the ambiguous single-letter names (E741) this codebase used for invoice
# lines, and unused noqa directives (RUF100).  Style-only rules are left off so
# the check stays about real defects rather than formatting preferences.
select = ["F", "E741", "RUF100"]
